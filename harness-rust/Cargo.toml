[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [
  "crates/agent-core",
  "crates/harness-cache",
  "crates/shared",
]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time and identifiers
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# File locking
fs2 = "0.4"
scopeguard = "1"
lru = "0.18"

# Testing
tempfile = "3"

# Terminal colors
colored = "2"

# Regex
regex = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"

# SQLite (used by shared, agent-core, harness-cache)
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
strip = "symbols"
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.release.package."*"]
strip = "symbols"
