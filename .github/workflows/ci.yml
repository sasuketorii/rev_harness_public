name: Harness CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "develop", "codex/**" ]
  pull_request:
    branches: [ "main", "develop", "codex/**" ]
  workflow_dispatch:
    inputs:
      gate_tier:
        description: "Harness gate tier to run"
        required: true
        default: "full"
        type: choice
        options:
          - quick
          - local
          - full
      live_cross_family_smoke:
        description: "Run opt-in live Codex -> Opus artifact smoke on this runner"
        required: true
        default: false
        type: boolean

jobs:
  harness-release-gate:
    name: Harness Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # scripts/_canonical-guard.sh defaults to requiring $HOME/dev/rev_harness
      # as the canonical root. On a CI runner the checkout path never matches
      # that, so set REV_HARNESS_CANONICAL_ROOT explicitly to github.workspace
      # to avoid a false "vendored copy" rejection (exit 70).
      REV_HARNESS_CANONICAL_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js is provisioned only as a generic trusted runtime (some harness
      # tooling resolves a `node` binary). There is no npm dependency tree to
      # cache or install here.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # jq: used pervasively for JSON policy/registry checks.
      # ripgrep (rg): required by rev_harness_skill_routing_test.sh,
      #   rev_harness_dual_native_check_test.sh, and self_growth_proposal_cycle_test.sh.
      # time (the standalone /usr/bin/time binary, distinct from the bash
      #   builtin): required by scripts/harness-benchmark.sh's peak-RSS
      #   measurement (harness_benchmark_contract_test.sh). ubuntu-latest
      #   does not ship it by default, so without this the benchmark script
      #   silently degrades to "skipped" and the contract test's summary.tsv
      #   assertions have no data rows to match.
      - name: Install jq, ripgrep, and time
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep time

      # A fresh checkout has no .shared/project_id: it is repo-local, per-clone
      # runtime identity and is intentionally gitignored (see .gitignore and
      # docs/manual on project identity). Any real adopter runs this bootstrap
      # once after cloning; the CI runner needs the same step so gate tests
      # that shell out through the wrappers (which fail closed without an
      # identity) have something valid to read. This mirrors
      # scripts/init-project.sh's bootstrap_project_id step without its other
      # first-clone side effects (template scaffolding, .gitignore edits).
      - name: Bootstrap repo-local project identity
        run: bash scripts/project-id.sh bootstrap rev_harness_public_ci

      - name: Run authoritative harness gate
        env:
          HARNESS_CI_GATE_TIER: ${{ inputs.gate_tier || 'full' }}
        run: bash test/integration/harness_release_gate.sh --tier "$HARNESS_CI_GATE_TIER"

      - name: Run opt-in live cross-family smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_cross_family_smoke }}
        run: bash scripts/cross-family-live-artifact-smoke.sh --json

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-release-gate-artifacts
          path: .claude/tmp/harness-release-gate/
          if-no-files-found: warn

      - name: Upload live smoke artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.live_cross_family_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: cross-family-live-smoke-artifacts
          path: .claude/tmp/cross-family-live-smoke-*/
          if-no-files-found: warn
